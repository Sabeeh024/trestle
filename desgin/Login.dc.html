<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Manrope',system-ui,sans-serif}</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;--background:oklch(0.99 0.002 260);--background-subtle:oklch(0.97 0.003 260);--background-muted:oklch(0.94 0.004 260);--text-primary:oklch(0.20 0.01 260);--text-secondary:oklch(0.45 0.01 260);--text-disabled:oklch(0.65 0.01 260);--text-inverse:oklch(0.98 0.002 260);--border:oklch(0.89 0.005 260);--border-strong:oklch(0.78 0.007 260);--action-primary:oklch(0.55 0.19 295);--action-primary-hover:oklch(0.47 0.20 295);--action-primary-text:oklch(0.98 0.002 260);background:var(--background-subtle)">
  <div style="width:100%;max-width:400px;background:var(--background);border:1px solid var(--border);border-radius:12px;padding:40px;box-shadow:0 4px 24px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:20px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:16px">
      <div style="width:40px;height:40px;border-radius:10px;background:var(--action-primary);color:var(--action-primary-text);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px">T</div>
      <div style="text-align:center">
        <div style="font-size:24px;font-weight:700;color:var(--text-primary)">Sign in to Trestle</div>
        <div style="font-size:14px;color:var(--text-secondary);margin-top:4px">Welcome back. Enter your details to continue.</div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;flex-direction:column;gap:6px">
        <label style="font-size:13px;font-weight:600;color:var(--text-secondary)">Email</label>
        <input type="email" placeholder="you@company.com" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;color:var(--text-primary);background:var(--background)">
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;align-items:baseline;justify-content:space-between">
          <label style="font-size:13px;font-weight:600;color:var(--text-secondary)">Password</label>
          <span style="font-size:13px;color:var(--action-primary);cursor:pointer">Forgot password?</span>
        </div>
        <input type="password" placeholder="••••••••" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;color:var(--text-primary);background:var(--background)">
      </div>
    </div>

    <button style="width:100%;background:var(--action-primary);color:var(--action-primary-text);border:none;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;box-shadow:0 2px 8px oklch(0.55 0.19 295 / 0.35)">Sign in</button>

    <div style="display:flex;align-items:center;gap:12px">
      <div style="flex:1;height:1px;background:var(--border)"></div>
      <span style="font-size:12px;color:var(--text-disabled)">or</span>
      <div style="flex:1;height:1px;background:var(--border)"></div>
    </div>

    <button style="width:100%;background:transparent;color:var(--text-primary);border:1px solid var(--border);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer">Continue with SSO</button>

    <div style="text-align:center;font-size:14px;color:var(--text-secondary)">Don't have an account? <span style="color:var(--action-primary);font-weight:600;cursor:pointer">Sign up</span></div>
  </div>
</div>

</x-dc>
</body>
</html>
