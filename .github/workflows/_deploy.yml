name: Deploy one environment

# Deploys one commit to one environment (staging or production) and proves it worked. It is called by deploy.yml and
# does not run on its own. Order matters: the database is migrated first, then the API, then the web apps, then a
# smoke test checks the result. A failure stops the run before anything later changes.
#
# Each GitHub Environment (Settings > Environments) holds its own secrets and variables, so staging and production
# can never use each other's database or keys:
#   secrets:   DATABASE_URL_DIRECT, RENDER_DEPLOY_HOOK_URL, VERCEL_WEB_PROJECT_ID, VERCEL_MARKETING_PROJECT_ID
#   variables: API_PUBLIC_URL, WEB_PUBLIC_URL, MARKETING_PUBLIC_URL
# and the repository holds VERCEL_TOKEN and VERCEL_ORG_ID.

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      sha:
        description: The commit to deploy. Its images must already have been published by CI.
        type: string
        required: true
      smoke-level:
        description: "full (signs in, needs demo data: staging) or basic (read-only: production)"
        type: string
        default: full

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy ${{ inputs.sha }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ inputs.environment }}
    # One deploy per environment at a time, and a running deploy is never cancelled half way.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}

      - name: Check that this commit's images were published
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_ENV"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if ! docker manifest inspect "ghcr.io/${GITHUB_REPOSITORY,,}/api:$SHA" > /dev/null; then
            echo "No published image for $SHA. Only commits that passed CI on main are published." >&2
            exit 1
          fi

      # The old API keeps running while this happens, so a migration must only ever add to the schema.
      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
        run: |
          docker run --rm -e DATABASE_URL "$IMAGE:$SHA" node dist/migrate.js

      - name: Deploy the API (Render)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          # The hook already carries ?key=..., and imgURL names the exact tag to run.
          image=$(jq -rn --arg v "$IMAGE:$SHA" '$v|@uri')
          curl -fsS -X POST "${HOOK}&imgURL=${image}" > /dev/null
          echo "Asked Render to run $IMAGE:$SHA"

      - name: Wait until the new API build is the one answering
        env:
          API: ${{ vars.API_PUBLIC_URL }}
        run: |
          # A free-tier service takes about a minute to wake, and the hook returns before the deploy finishes.
          for i in $(seq 1 80); do
            if curl -fsS --max-time 20 "$API/health" 2>/dev/null | grep -q "\"version\":\"$SHA\""; then
              echo "API is running $SHA"
              exit 0
            fi
            sleep 10
          done
          echo "The API did not report version $SHA in time" >&2
          exit 1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install the Vercel CLI
        run: npm install --global vercel && vercel --version

      # Built here from this commit, then uploaded as it is (--prebuilt), so Vercel runs the same code CI tested. Each
      # app is its own Vercel project, and in each environment its "production" target is the live one.
      - name: Deploy the web app (Vercel)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
        run: |
          rm -rf .vercel
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel build --prod --token "$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"

      - name: Deploy the marketing site (Vercel)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_MARKETING_PROJECT_ID }}
        run: |
          rm -rf .vercel
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel build --prod --token "$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"

      - name: Smoke test
        env:
          MARKETING_URL: ${{ vars.MARKETING_PUBLIC_URL }}
          APP_URL: ${{ vars.WEB_PUBLIC_URL }}
          ADMIN_URL: ${{ vars.API_PUBLIC_URL }}
          SMOKE_LEVEL: ${{ inputs.smoke-level }}
          EXPECT_VERSION: ${{ inputs.sha }}
          # The password the seed gave the demo accounts (staging); unset means the default.
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
          WAIT_SECONDS: "300"
        run: bash scripts/smoke.sh

      - name: What to do if this failed
        if: failure()
        run: |
          {
            echo "### Deploy to ${{ inputs.environment }} failed"
            echo "Nothing is rolled back automatically. To go back to a known-good commit, run the **Deploy** workflow"
            echo "manually with that commit's SHA and this environment. Migrations only ever add to the schema, so"
            echo "the previous version keeps working against the migrated database."
          } >> "$GITHUB_STEP_SUMMARY"
