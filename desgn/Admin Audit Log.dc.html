<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Manrope',system-ui,sans-serif}a{color:var(--action-primary);text-decoration:none}a:hover{color:var(--action-primary-hover)}</style>
</helmet>
<div style="{{themeVars}}background:var(--background);color:var(--text-primary);min-height:100vh;display:flex;font-size:14px">

  <div style="flex:none;width:200px;display:flex;flex-direction:column;gap:2px;padding:12px 8px;background:var(--background-subtle);border-right:1px solid var(--border)">
    <div style="display:flex;align-items:center;gap:8px;padding:8px;margin-bottom:8px">
      <div style="width:22px;height:22px;border-radius:4px;background:var(--action-primary);color:var(--action-primary-text);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px">T</div>
      <span style="font-size:13px;font-weight:700">Trestle Admin</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:4px;color:var(--text-secondary);font-size:13px"><span style="width:14px;height:14px;border-radius:3px;background:var(--text-disabled);opacity:.5;flex:none"></span>Users</div>
    <div style="display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:4px;color:var(--text-secondary);font-size:13px"><span style="width:14px;height:14px;border-radius:3px;background:var(--text-disabled);opacity:.5;flex:none"></span>Organizations</div>
    <div style="display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:4px;color:var(--text-secondary);font-size:13px"><span style="width:14px;height:14px;border-radius:3px;background:var(--text-disabled);opacity:.5;flex:none"></span>Projects</div>
    <div style="display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:4px;color:var(--text-secondary);font-size:13px"><span style="width:14px;height:14px;border-radius:3px;background:var(--text-disabled);opacity:.5;flex:none"></span>Billing</div>
    <div style="display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:4px;background:var(--background-muted);color:var(--text-primary);font-size:13px;font-weight:600;border-left:2px solid var(--action-primary);margin-left:-2px"><span style="width:14px;height:14px;border-radius:3px;background:var(--action-primary);flex:none"></span>Audit Log</div>
    <div style="display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:4px;color:var(--text-secondary);font-size:13px"><span style="width:14px;height:14px;border-radius:3px;background:var(--text-disabled);opacity:.5;flex:none"></span>Settings</div>
  </div>

  <div style="flex:1;min-width:0;display:flex;flex-direction:column">
    <div style="flex:none;height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;border-bottom:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:13px;font-weight:600;color:var(--text-primary)">Admin Panel</span>
        <span style="font-size:11px;font-weight:700;color:var(--feedback-warning);background:var(--feedback-warning-bg);border-radius:4px;padding:2px 6px;text-transform:uppercase;letter-spacing:.03em">Staging</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <button onclick="{{toggleTheme}}" style="background:transparent;border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:11px;font-weight:600;color:var(--text-primary);font-family:inherit;cursor:pointer">{{themeLabel}}</button>
        <div style="width:22px;height:22px;border-radius:4px;background:var(--background-muted);color:var(--text-secondary);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700">JK</div>
      </div>
    </div>

    <div style="flex:1;display:flex;flex-direction:column;overflow:hidden">
      <div style="flex:none;padding:16px 16px 0;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-disabled)"><span>Admin</span><span>/</span><span style="color:var(--text-primary);font-weight:600">Audit Log</span></div>
      <div style="flex:none;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <div style="font-size:20px;font-weight:700">Audit Log</div>
        <div style="display:flex;gap:8px">
          <select style="padding:6px 10px;border:1px solid var(--border);border-radius:4px;font-size:13px;font-family:inherit;color:var(--text-primary);background:var(--background)"><option>All actions</option></select>
          <input placeholder="Search by actor or target" style="width:220px;padding:6px 10px;border:1px solid var(--border);border-radius:4px;font-size:13px;font-family:inherit;color:var(--text-primary);background:var(--background)">
        </div>
      </div>

      <div style="flex:1;overflow:auto;padding:0 16px 16px">
        <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)">
        <table style="width:100%;border-collapse:collapse;min-width:760px">
          <thead><tr>
            <th style="text-align:left;font-size:12px;font-weight:600;color:var(--text-secondary);padding:10px 12px;border-bottom:1px solid var(--border);background:var(--background-subtle)">Timestamp</th>
            <th style="text-align:left;font-size:12px;font-weight:600;color:var(--text-secondary);padding:10px 12px;border-bottom:1px solid var(--border);background:var(--background-subtle)">Actor</th>
            <th style="text-align:left;font-size:12px;font-weight:600;color:var(--text-secondary);padding:10px 12px;border-bottom:1px solid var(--border);background:var(--background-subtle)">Action</th>
            <th style="text-align:left;font-size:12px;font-weight:600;color:var(--text-secondary);padding:10px 12px;border-bottom:1px solid var(--border);background:var(--background-subtle)">Target</th>
          </tr></thead>
          <tbody>
            <sc-for list="{{logs}}" as="l" hint-placeholder-count="8">
              <tr>
                <td style="padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text-disabled);font-family:monospace;font-size:12px;white-space:nowrap">{{l.time}}</td>
                <td style="padding:10px 12px;border-bottom:1px solid var(--border);font-weight:600;color:var(--text-primary)">{{l.actor}}</td>
                <td style="padding:10px 12px;border-bottom:1px solid var(--border)"><span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:{{l.actionColor}};background:{{l.actionBg}};border-radius:999px;padding:3px 9px 3px 7px;font-weight:600"><span style="width:6px;height:6px;border-radius:50%;background:{{l.actionColor}}"></span>{{l.action}}</span></td>
                <td style="padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text-secondary)">{{l.target}}</td>
              </tr>
            </sc-for>
          </tbody>
        </table>
        <div style="padding:10px 12px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);background:var(--background-subtle)">
          <span style="font-size:12px;color:var(--text-secondary)">Showing latest 8 events</span>
          <button style="background:transparent;border:1px solid var(--border);border-radius:4px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--text-primary);font-family:inherit;cursor:pointer">Load more</button>
        </div>
        </div>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Theme&quot;}}">
class Component extends DCLogic {
  state = { dark: this.props.dark ?? false };
  logsData = [
    { time: '2026-09-23 14:02:11', actor: 'jordan.kim@trestle.io', action: 'suspend_user', target: 'tom.baker@haldane.co' },
    { time: '2026-09-23 11:47:03', actor: 'alex.kim@northwind.io', action: 'create_project', target: 'Website Redesign' },
    { time: '2026-09-22 19:15:40', actor: 'system', action: 'billing_charge', target: 'Fontaine Co. — $108.00' },
    { time: '2026-09-22 16:30:12', actor: 'maya@fontaineco.com', action: 'invite_user', target: 'noah@fontaineco.com' },
    { time: '2026-09-22 09:05:57', actor: 'jordan.kim@trestle.io', action: 'delete_project', target: 'Legacy Migration' },
    { time: '2026-09-21 22:41:19', actor: 'priya@verity.app', action: 'update_role', target: 'sam.r@umbralabs.dev → Member' },
    { time: '2026-09-21 13:12:05', actor: 'system', action: 'login_failed', target: 'unknown@haldane.co' },
    { time: '2026-09-20 08:58:44', actor: 'jordan.kim@trestle.io', action: 'create_organization', target: 'Umbra Labs' },
  ];
  actionStyle(a) {
    if (a.startsWith('delete') || a.startsWith('suspend') || a.includes('failed')) return { color: 'var(--feedback-danger)', bg: 'var(--feedback-danger-bg)' };
    if (a.startsWith('create') || a.startsWith('invite')) return { color: 'var(--feedback-success)', bg: 'var(--feedback-success-bg)' };
    return { color: 'var(--feedback-warning)', bg: 'var(--feedback-warning-bg)' };
  }
  renderVals() {
    const dark = this.state.dark;
    const lightVars = '--background:oklch(0.99 0.002 260);--background-subtle:oklch(0.97 0.003 260);--background-muted:oklch(0.94 0.004 260);--text-primary:oklch(0.20 0.01 260);--text-secondary:oklch(0.45 0.01 260);--text-disabled:oklch(0.65 0.01 260);--text-inverse:oklch(0.98 0.002 260);--border:oklch(0.89 0.005 260);--border-strong:oklch(0.78 0.007 260);--action-primary:oklch(0.55 0.19 295);--action-primary-hover:oklch(0.47 0.20 295);--action-primary-text:oklch(0.98 0.002 260);--feedback-success:oklch(0.55 0.15 145);--feedback-success-bg:oklch(0.95 0.04 145);--feedback-warning:oklch(0.60 0.15 70);--feedback-warning-bg:oklch(0.95 0.05 70);--feedback-danger:oklch(0.55 0.18 25);--feedback-danger-bg:oklch(0.95 0.04 25);';
    const darkVars = '--background:oklch(0.19 0.006 260);--background-subtle:oklch(0.23 0.007 260);--background-muted:oklch(0.28 0.008 260);--text-primary:oklch(0.96 0.003 260);--text-secondary:oklch(0.75 0.006 260);--text-disabled:oklch(0.50 0.006 260);--text-inverse:oklch(0.15 0.005 260);--border:oklch(0.32 0.007 260);--border-strong:oklch(0.42 0.008 260);--action-primary:oklch(0.72 0.18 295);--action-primary-hover:oklch(0.78 0.16 295);--action-primary-text:oklch(0.15 0.005 260);--feedback-success:oklch(0.70 0.14 145);--feedback-success-bg:oklch(0.28 0.05 145);--feedback-warning:oklch(0.75 0.14 70);--feedback-warning-bg:oklch(0.30 0.06 70);--feedback-danger:oklch(0.68 0.17 25);--feedback-danger-bg:oklch(0.28 0.05 25);';
    const logs = this.logsData.map(l => { const s = this.actionStyle(l.action); return { ...l, actionColor: s.color, actionBg: s.bg }; });
    return {
      themeVars: dark ? darkVars : lightVars,
      themeLabel: dark ? '☾ Dark' : '☀ Light',
      toggleTheme: () => this.setState(s => ({ dark: !s.dark })),
      logs,
    };
  }
}
</script>
</body>
</html>
